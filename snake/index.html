<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    color: #eee;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  h1 { font-size: 28px; margin-bottom: 12px; letter-spacing: 4px; }
  .hud {
    display: flex;
    gap: 32px;
    margin-bottom: 12px;
    font-size: 18px;
  }
  .hud span { color: #ffd166; font-weight: bold; }
  .board {
    position: relative;
    border: 3px solid #4ecca3;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(78, 204, 163, 0.4);
  }
  canvas { display: block; background: #16213e; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.65);
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 32px; color: #ffd166; }
  .overlay p { font-size: 15px; color: #ccc; line-height: 1.7; }
  button {
    padding: 10px 28px;
    font-size: 17px;
    border: none;
    border-radius: 6px;
    background: #4ecca3;
    color: #1a1a2e;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #6ee7c0; }
  .controls {
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    margin-top: 16px;
  }
  .controls button { font-size: 22px; padding: 0; }
  .controls .up { grid-column: 2; grid-row: 1; }
  .controls .left { grid-column: 1; grid-row: 2; }
  .controls .right { grid-column: 3; grid-row: 2; }
  .controls .down { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) { .controls { display: grid; } }
  .tip { margin-top: 12px; font-size: 13px; color: #888; }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="hud">
    <div>得分：<span id="score">0</span></div>
    <div>最高分：<span id="best">0</span></div>
    <div>速度：<span id="level">1</span></div>
  </div>
  <div class="board">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">贪吃蛇</h2>
      <p id="overlayText">方向键 / WASD 控制移动<br>空格键暂停</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="controls">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>
  <p class="tip">按 P 或空格暂停 / 继续</p>

<script>
(() => {
  const GRID = 20;
  const CELL = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  let snake, dir, nextDir, food, score, best, running, paused, timer, speed;

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = DIRS.right;
    nextDir = dir;
    score = 0;
    speed = 150;
    scoreEl.textContent = 0;
    levelEl.textContent = 1;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)];
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    schedule();
    draw();
  }

  function schedule() {
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function tick() {
    if (!running || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score % 50 === 0 && speed > 60) {
        speed -= 15;
        levelEl.textContent = Math.round((150 - speed) / 15) + 1;
        schedule();
      }
      if (snake.length === GRID * GRID) return win();
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function saveBest() {
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
    }
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    saveBest();
    overlayTitle.textContent = '游戏结束';
    overlayText.innerHTML = `得分：${score}<br>最高分：${best}`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function win() {
    running = false;
    clearInterval(timer);
    saveBest();
    overlayTitle.textContent = '你赢了！';
    overlayText.textContent = `满分：${score}`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = '已暂停';
      overlayText.textContent = '按空格或 P 继续';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  function setDir(name) {
    const d = DIRS[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  function draw() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#ffd166' : `hsl(160, 60%, ${55 - (i / snake.length) * 25}%)`;
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  document.addEventListener('keydown', e => {
    const map = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right',
    };
    if (map[e.key]) {
      e.preventDefault();
      if (!running) start();
      setDir(map[e.key]);
    } else if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      running ? togglePause() : start();
    }
  });

  document.querySelectorAll('.controls button').forEach(btn =>
    btn.addEventListener('click', () => {
      if (!running) start();
      setDir(btn.dataset.dir);
    })
  );

  startBtn.addEventListener('click', () => (running && paused ? togglePause() : start()));

  reset();
  draw();
})();
</script>
</body>
</html>
